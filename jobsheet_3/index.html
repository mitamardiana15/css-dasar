<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kedai Mita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Kedai Mita</div>
        <nav>
            <ul class="menus">
                <button><li>menu1</li></button>
                <button><li>menu2</li></button>
               <button><li>menu3</li></button>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h2>Judul Promo</h2>
            <p>Deskripsi promo yang menarik untuk pelanggan setia Kedai Mita. Diskon besar dan gratis ongkir.</p>
            <p>Belanja sekarang dan dapatkan penawaran terbaik hari ini juga.</p>
            <button class="btn">Belanja Sekarang</button>
        </div>
        <div class="hero-image">
            <img src="o.jpg" alt="Promo Kedai Mita">
        </div>
    </section>

    <!-- Produk Section -->
    <section class="produk-section">
        <h3>Galeri Produk</h3>
        <div class="galeri">
            <div class="card">
                <img src="u.jpg" alt="Seblak Lekoh">
                <p>Seblak Lekoh</p>
                <button class="btn-kecil">Beli</button>
            </div>
            
            <div class="card">
                <img src="t.jpg" alt="Seblak Rafael">
                <p>Mie Ayam</p>
                <button class="btn-kecil">Beli</button>
            </div>

            <div class="card">
                <img src="w.jpg" alt="Pisang Krispi">
                <p>Pisang Krispi</p>
                <button class="btn-kecil">Beli</button>
            </div>
            
            <div class="card">
                <img src="a.jpg" alt="Minuman Segar">
                <p>Minuman Segar</p>
                <button class="btn-kecil">Beli</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div>&copy; 2026 Kedai Mita</div>
        <div class="footer-menu">
            <span>FB</span>
            <span>IG</span>
            <span>YT</span>
        </div>
    </footer>

</body>
</html>
